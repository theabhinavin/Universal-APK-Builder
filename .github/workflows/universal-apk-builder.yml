name: Universal APK Builder

on:
  workflow_dispatch:
    inputs:
      project_type:
        description: "Project type (auto-detect is recommended)"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - native-android
          - flutter
          - react-native
      build_variant:
        description: "Build variant"
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: universal-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Detect and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        shell: bash
        env:
          REQUESTED_TYPE: ${{ inputs.project_type }}
        run: |
          set -euo pipefail
          kind="${REQUESTED_TYPE}"
          if [[ "$kind" == "auto" ]]; then
            if [[ -f "pubspec.yaml" && -d "android" ]]; then
              kind="flutter"
            elif [[ -f "package.json" && -d "android" ]]; then
              kind="react-native"
            elif [[ -f "gradlew" || ( -d "app" && -f "settings.gradle" ) || ( -d "app" && -f "settings.gradle.kts" ) ]]; then
              kind="native-android"
            elif [[ -f "android/gradlew" ]]; then
              kind="native-android"
            else
              echo "::error::Could not identify an Android project. Expected pubspec.yaml, package.json + android/, or a Gradle Android project."
              exit 1
            fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Detected project type: $kind"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        if: steps.detect.outputs.kind == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node.js
        if: steps.detect.outputs.kind == 'react-native'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JavaScript dependencies
        if: steps.detect.outputs.kind == 'react-native'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable || yarn install --frozen-lockfile
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            npm install
          fi

      - name: Get Flutter dependencies
        if: steps.detect.outputs.kind == 'flutter'
        run: flutter pub get

      - name: Build Native Android APK
        if: steps.detect.outputs.kind == 'native-android'
        shell: bash
        env:
          VARIANT: ${{ inputs.build_variant }}
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            if [[ "$VARIANT" == "release" ]]; then
              ./gradlew assembleRelease --no-daemon
            else
              ./gradlew assembleDebug --no-daemon
            fi
          elif [[ -f ./android/gradlew ]]; then
            cd android
            chmod +x ./gradlew
            if [[ "$VARIANT" == "release" ]]; then
              ./gradlew assembleRelease --no-daemon
            else
              ./gradlew assembleDebug --no-daemon
            fi
          else
            echo "::error::Gradle wrapper not found. Commit gradlew and the gradle/wrapper files to the repository."
            exit 1
          fi

      - name: Build Flutter APK
        if: steps.detect.outputs.kind == 'flutter'
        env:
          VARIANT: ${{ inputs.build_variant }}
        run: |
          set -euo pipefail
          if [[ "$VARIANT" == "release" ]]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi

      - name: Build React Native APK
        if: steps.detect.outputs.kind == 'react-native'
        shell: bash
        env:
          VARIANT: ${{ inputs.build_variant }}
        run: |
          set -euo pipefail
          cd android
          chmod +x ./gradlew
          if [[ "$VARIANT" == "release" ]]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Find APK files
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -path '*/build/outputs/apk/*.apk' -o -type f -path '*/build/outputs/apk/**/*.apk' | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::Build finished but no APK was found."
            exit 1
          fi
          mkdir -p dist
          for file in "${files[@]}"; do
            cp "$file" "dist/$(basename "$(dirname "$file")")-$(basename "$file")"
          done
          echo "Found ${#files[@]} APK file(s):"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.detect.outputs.kind }}-${{ inputs.build_variant }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
